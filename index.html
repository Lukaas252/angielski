const $=id=>document.getElementById(id);
const INTERVAL=600000;
let index=0, last=Date.now(), requestId=0;

function save(){try{localStorage.setItem('eng10k_index',String(index));localStorage.setItem('eng10k_last',String(last))}catch(e){}}
function clock(){const now=new Date();$('clock').textContent=now.toLocaleTimeString('pl-PL',{hour:'2-digit',minute:'2-digit'});let elapsed=Date.now()-last;if(elapsed>=INTERVAL){const steps=Math.floor(elapsed/INTERVAL);index=(index+steps)%words.length;last+=steps*INTERVAL;save();show()}const left=Math.max(0,INTERVAL-(Date.now()-last));const s=Math.ceil(left/1000);$('remaining').textContent='Zmiana za '+String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');$('fill').style.width=(100-left/INTERVAL*100)+'%'}
function step(n){index=(index+n+words.length)%words.length;last=Date.now();save();show();clock()}
function translate(w,token){const key='eng10k_'+w;let cached;try{cached=localStorage.getItem(key)}catch(e){}if(cached){$('translation').textContent=cached;$('translation').className='translation';return}const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),9000);fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(w)+'&langpair=en|pl',{signal:controller.signal}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(data=>{if(token!==requestId)return;let value=(data.responseData&&data.responseData.translatedText||'').trim();const valid=value&&value.toLowerCase()!==w.toLowerCase()&&!/^(mymemory|invalid|quota|query length)/i.test(value);if(!valid)throw Error('Brak tłumaczenia');$('translation').textContent=value;$('translation').className='translation';try{localStorage.setItem(key,value)}catch(e){}}).catch(()=>{if(token!==requestId)return;$('translation').textContent='Sprawdź tłumaczenie w słowniku ↓';$('translation').className='translation error'}).finally(()=>clearTimeout(timeout))}
function show(){const w=words[index];const token=++requestId;$('word').textContent=w;$('translation').textContent='Pobieranie tłumaczenia…';$('translation').className='translation loading';$('counter').textContent='Słowo '+(index+1).toLocaleString('pl-PL')+' / 10 000';$('dictionary').href='https://translate.google.com/?sl=en&tl=pl&text='+encodeURIComponent(w)+'&op=translate';$('phon').textContent='';$('status').textContent='';translate(w,token)}
